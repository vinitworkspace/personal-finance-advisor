{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block unauth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon">₹</div>
      <h2>Welcome Back</h2>
      <p>Sign in to access your personal finance dashboard</p>
    </div>

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next', '')) }}">
      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="name@example.com" 
          value="{{ email or '' }}" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="••••••••" 
          required 
          autocomplete="current-password"
        >
      </div>

      <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px;">
        <label style="display: flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--text-muted); cursor: pointer;">
          <input type="checkbox" name="remember" value="1">
          Remember me
        </label>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>

      <!-- Viva Demonstration Fast Login Helper -->
      <div class="demo-login-box">
        <button type="button" class="demo-btn" onclick="fillDemoCredentials()">
          ⚡ Quick Demo Account (Viva / Examiner Test)
        </button>
      </div>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Create Account</a>
    </div>
  </div>
</div>
{% endblock %}
