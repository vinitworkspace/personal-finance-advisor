{% extends "base.html" %}

{% block title %}Create Account{% endblock %}

{% block unauth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon">₹</div>
      <h2>Get Started</h2>
      <p>Create your personal finance and budgeting workspace</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input 
          type="text" 
          id="name" 
          name="name" 
          class="form-control" 
          placeholder="e.g. Alex Sharma" 
          value="{{ name or '' }}" 
          required 
          autocomplete="name"
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email Address</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          class="form-control" 
          placeholder="alex@example.com" 
          value="{{ email or '' }}" 
          required 
          autocomplete="email"
        >
      </div>

      <div class="form-group">
        <label for="currency" class="form-label">Primary Currency</label>
        <select id="currency" name="currency" class="form-control">
          <option value="₹" {% if currency == '₹' %}selected{% endif %}>₹ Indian Rupee (INR)</option>
          <option value="$" {% if currency == '$' %}selected{% endif %}>$ US Dollar (USD)</option>
          <option value="€" {% if currency == '€' %}selected{% endif %}>€ Euro (EUR)</option>
          <option value="£" {% if currency == '£' %}selected{% endif %}>£ British Pound (GBP)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-control" 
          placeholder="Minimum 6 characters" 
          required 
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          class="form-control" 
          placeholder="Re-enter password" 
          required 
          autocomplete="new-password"
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        Register Account
      </button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a>
    </div>
  </div>
</div>
{% endblock %}
